services:
  mysql:
    image: mysql:latest
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123456
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      PMA_ARBITRARY: 1
    ports:
      - "80:80"

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  pulsar:
    image: apachepulsar/pulsar:5.0.0-M1
    container_name: pulsar
    ports:
      - "6650:6650"
    command: bin/pulsar standalone --advertised-address localhost
    volumes:
      - pulsar_data:/pulsar/data
      - pulsar_conf:/pulsar/conf

volumes:
  mysql_data:
  redis_data:
  pulsar_data:
  pulsar_conf:
